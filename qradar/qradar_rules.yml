# ============================================================
# MilliSec Blue Team - SIEM Detection Rules (QRadar)
# ------------------------------------------------------------
# Source      : Windows Domain Controller (DC01) via WinCollect
#               (Microsoft Windows Security Event Log) + Sysmon
#               (Microsoft-Windows-Sysmon/Operational).
# Workflow    : These 10 detections are built as Custom Rules in the
#               QRadar console (so matches raise Offenses), then
#               EXPORTED via the REST API into a version-controlled
#               extension (qradar/rules_extension.zip). deploy_qradar.py
#               re-imports that extension with overwrite=true, so editing
#               a rule in Git + re-running the script updates QRadar.
# Note        : The 'aql' blocks below document each rule's detection
#               logic for reference; the authoritative content ships in
#               the exported extension.
# Coverage    : Windows / Active Directory + Sysmon (10 rules)
# ============================================================

rules:

  - name: "AD - New User Account Created"
    description: "A new Active Directory user account was created (Windows Event ID 4720)."
    severity: high
    aql: >
      SELECT QIDNAME(qid) AS event, "Username" AS actor, sourceip, LOGSOURCENAME(logsourceid) AS log_source, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '4720'
      LAST 1 HOURS

  - name: "AD - User Added to Privileged Group"
    description: "A user was added to a security-enabled (admin) group (Event ID 4728/4732/4756)."
    severity: critical
    aql: >
      SELECT QIDNAME(qid) AS event, "Username" AS actor, sourceip, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" IN ('4728','4732','4756')
      LAST 1 HOURS

  - name: "AD - Brute Force (Failed Logon Burst)"
    description: "Multiple failed logons from the same source within a short window (Event ID 4625)."
    severity: high
    aql: >
      SELECT sourceip, "Username" AS target_user, COUNT(*) AS failures
      FROM events
      WHERE "EventID" = '4625'
      GROUP BY sourceip, "Username"
      HAVING failures > 10
      LAST 1 HOURS

  - name: "AD - Account Lockout"
    description: "A user account was locked out, often a sign of brute force (Event ID 4740)."
    severity: medium
    aql: >
      SELECT "Username" AS locked_user, sourceip, COUNT(*) AS lockouts, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '4740'
      GROUP BY locked_user
      LAST 1 HOURS

  - name: "AD - User Account Deleted"
    description: "An Active Directory user account was deleted (Event ID 4726)."
    severity: high
    aql: >
      SELECT QIDNAME(qid) AS event, "Username" AS actor, sourceip, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '4726'
      LAST 1 HOURS

  - name: "AD - Special Privileges Assigned at Logon"
    description: "A logon was granted special (administrative) privileges (Event ID 4672)."
    severity: medium
    aql: >
      SELECT "Username" AS actor, sourceip, COUNT(*) AS total, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '4672'
      GROUP BY actor
      LAST 1 HOURS

  - name: "AD - Security Audit Log Cleared"
    description: "The Windows security event log was cleared, a common anti-forensics action (Event ID 1102)."
    severity: critical
    aql: >
      SELECT QIDNAME(qid) AS event, "Username" AS actor, sourceip, LOGSOURCENAME(logsourceid) AS log_source, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '1102'
      LAST 1 HOURS

  - name: "AD - User Password Reset by Another Account"
    description: "An administrator reset another user's password (Event ID 4724)."
    severity: medium
    aql: >
      SELECT QIDNAME(qid) AS event, "Username" AS actor, sourceip, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '4724'
      LAST 1 HOURS

  - name: "AD - Disabled Account Re-Enabled"
    description: "A previously disabled user account was re-enabled (Event ID 4722)."
    severity: high
    aql: >
      SELECT QIDNAME(qid) AS event, "Username" AS actor, sourceip, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '4722'
      LAST 1 HOURS

  - name: "Sysmon - Suspicious Process Creation (LOLBins)"
    description: "Execution of living-off-the-land binaries often abused by attackers (Sysmon Event ID 1)."
    severity: high
    aql: >
      SELECT QIDNAME(qid) AS event, "Process Name" AS process, "Username" AS actor, sourceip, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm:ss') AS time
      FROM events
      WHERE "EventID" = '1'
      AND ("Process Name" ILIKE '%powershell%' OR "Process Name" ILIKE '%cmd.exe%' OR "Process Name" ILIKE '%wmic%' OR "Process Name" ILIKE '%mshta%' OR "Process Name" ILIKE '%rundll32%' OR "Process Name" ILIKE '%certutil%')
      LAST 1 HOURS
